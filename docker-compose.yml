# Banco de dados local para desenvolvimento.
#   docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: carproject
      POSTGRES_USER: carproject
      POSTGRES_PASSWORD: carproject
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carproject"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
